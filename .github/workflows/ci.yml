name: ci

on:
  push:
    branches:
      - feat/adus-v1
  pull_request:
    branches:
      - feat/adus-v1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      # Same host ports as .cargo/config.toml, so the tests need no env override.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adus
          POSTGRES_PASSWORD: adus
          POSTGRES_DB: adus
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 55379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # rust-embed needs web/build to exist
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web check
      - run: pnpm -C web fmt:check
