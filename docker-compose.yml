# Production stack. Copy .env.example to .env (scripts/install.sh does it for you), then `docker compose up -d`.
services:
  adus:
    image: ${ADUS_IMAGE:-ghcr.io/return-nol/adus}:${ADUS_VERSION:-latest}
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://adus:${POSTGRES_PASSWORD}@postgres:5432/adus}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${ADUS_PORT:-8080}:8080"
    restart: unless-stopped
    # The binary drains in-flight jobs for 30 s after SIGTERM.
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false

  postgres:
    image: postgres:16
    profiles: [bundled]
    environment:
      POSTGRES_USER: adus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: adus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "adus", "-d", "adus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    profiles: [bundled]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Optional HTTPS in front of adus: COMPOSE_PROFILES=bundled,https and set ADUS_DOMAIN.
  caddy:
    image: caddy:2
    profiles: [https]
    environment:
      ADUS_DOMAIN: ${ADUS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - adus
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddydata:
