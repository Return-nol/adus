[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
adus-core = { path = "crates/core" }
adus-db = { path = "crates/db" }
adus-git = { path = "crates/git" }
adus-llm = { path = "crates/llm" }
adus-queue = { path = "crates/queue" }
adus-review = { path = "crates/review" }
adus-server = { path = "crates/server" }

aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
http-body-util = "0.1"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["derive", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

# Graf dependensi antar crate dideklarasikan dari awal; sebagian belum dipakai sampai task berikutnya.
[workspace.lints.cargo]
unused_dependencies = "allow"
