[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
adus-core = { path = "crates/core" }
adus-db = { path = "crates/db" }
adus-git = { path = "crates/git" }
adus-llm = { path = "crates/llm" }
adus-queue = { path = "crates/queue" }
adus-review = { path = "crates/review" }
adus-server = { path = "crates/server" }

aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["derive", "postgres", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Graf dependensi antar crate dideklarasikan dari awal; sebagian belum dipakai sampai task berikutnya.
[workspace.lints.cargo]
unused_dependencies = "allow"
