[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
adus-core = { path = "crates/core" }
adus-db = { path = "crates/db" }
adus-git = { path = "crates/git" }
adus-llm = { path = "crates/llm" }
adus-queue = { path = "crates/queue" }
adus-review = { path = "crates/review" }
adus-server = { path = "crates/server" }

aes-gcm = "0.10"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
globset = "0.4"
hex = "0.4"
hmac = "0.12"
ignore = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["json", "query"] }
regex = "1"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "3"
sqlx = { version = "0.8", default-features = false, features = ["derive", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "fs"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wiremock = "0.6"

# Graf dependensi antar crate dideklarasikan dari awal; sebagian belum dipakai sampai task berikutnya.
[workspace.lints.cargo]
unused_dependencies = "allow"

[profile.dev.package."*"]
debug = "line-tables-only"
